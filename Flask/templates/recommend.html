<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tastemaker AI — Follow Your Cravings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-text: #ffffff;
            --secondary-text: rgba(255, 255, 255, 0.8);
            --accent: #ffffff;
            --btn-text: #111111;
            --input-bg: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            /* Mood-setting background image */
            background: 
                linear-gradient(rgba(147, 145, 145, 0.902), rgba(0, 0, 0, 0.7)),
                url('{{ url_for("static", filename="image.jpeg") }}');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--primary-text);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 520px;
            text-align: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 60px 40px;
            border-radius: 24px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .emoji-header {
            font-size: 50px;
            margin-bottom: 24px;
            display: block;
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 12px;
        }

        .subtitle {
            color: var(--secondary-text);
            font-size: 18px;
            margin-bottom: 40px;
            line-height: 1.6;
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .input-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 10px;
            color: var(--secondary-text);
        }

        input[type="text"] {
            width: 100%;
            padding: 20px 24px;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            color: #ffffff;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        input[type="text"]:focus {
            border-color: #ffffff;
            background-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 20px;
            background: var(--accent);
            color: var(--btn-text);
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .submit-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .footer {
            margin-top: 40px;
            font-size: 13px;
            color: var(--secondary-text);
        }

        .footer b {
            color: #ffffff;
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0,0,0,0.1);
            border-top-color: var(--btn-text);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading .spinner { display: block; }
        .loading .btn-text { display: none; }

        @media (max-width: 480px) {
            .container { padding: 40px 24px; }
            h1 { font-size: 28px; }
        }
    </style>
</head>
<body style="padding-top:70px;">
    <div style="position:fixed; top:0; width:100%; background:#0f172a; padding:15px; display:flex; justify-content:space-between;">
    <h3 style="color:white;">Restaurant System</h3>
    
    <div>
        <a href="/" style="color:white; margin-right:20px;">Home</a>
         <a href="/" style="color:white; margin-right:20px;">recommend</a>
    </div>
</div>

    <div class="container">
        <span class="emoji-header"></span>

        <h1></h1>
        <p class="subtitle">Tell us what's on your mind today, and we'll find the perfect table.</p>
        
        <form action="/recommend" method="post" id="recommendationForm">
            <div class="form-group">
                <label class="input-label" for="restaurant">Enter your thought 🍽️</label>
                <input 
                    type="text" 
                    id="restaurant" 
                    name="restaurant" 
                    placeholder="Describe a craving or a favorite spot..."
                    required
                    autocomplete="off"
                    minlength="2"
                >
            </div>
            
            <button type="submit" class="submit-btn" id="submitBtn">
                <span class="btn-text">Discover Now ✨</span>
                <div class="spinner"></div>
            </button>
        </form>
        
        <div class="footer">
            <p>Powered by <b>NeuralDining™</b></p>
        </div>
    </div>

    <script>
        const form = document.getElementById('recommendationForm');
        const btn = document.getElementById('submitBtn');

        form.addEventListener('submit', function() {
            btn.classList.add('loading');
            btn.style.pointerEvents = 'none';
        });
    </script>
</body>
</html>
