<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Restaurant Recommendation System</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
}

/* NAVBAR */
.navbar {
    background: #0f172a;
    color: white;
    padding: 15px 40px;
    display: flex;
    justify-content: space-between;
}

.navbar a {
    color: white;
    margin-left: 20px;
    text-decoration: none;
}

/* MAIN SECTION */
.container {
    display: flex;
    justify-content: space-between;
    padding: 60px;
}

.text {
    width: 55%;
}

.text h1 {
    font-size: 28px;
}

.text p {
    color: #555;
}

.btn {
    margin-top: 20px;
    padding: 10px 20px;
    background: #0f172a;
    color: white;
    border: none;
    cursor: pointer;
}

/* IMAGE */
.image img {
    width: 400px;
}
</style>

</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <h2>Restaurant Recommendation System</h2>
    <div>
        <a href="/">Home</a>
        <a href="/recommend">Recommend</a>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="container">
    
    <div class="text">
        <h1>Build recommendation system with ease!!</h1>

        <p>
        In this age of information overload, people use a variety of strategies 
        to make choices about what to buy, how to spend their leisure time, and 
        even where to go. Recommender systems automate these strategies.
        </p>

        <!-- BUTTON -->
        <form action="/recommend" method="get">
            <button class="btn">Recommend</button>
        </form>
    </div>

    <div class="image">
        <img src="{{ url_for('static', filename='image1.png') }}">
    </div>

</div>

</body>
</html>
